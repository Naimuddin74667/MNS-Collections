name: Deploy MNS Inventory Worker

on:
  push:
    branches: [main]
    paths:
      - 'mns-inventory/**'
      - '.github/workflows/deploy-inventory.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mns-inventory
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler@4

      # Creates the D1 database on the first run, then writes its ID into wrangler.toml
      - name: Ensure D1 database exists
        run: |
          get_id() {
            wrangler d1 list --json 2>/dev/null | node -e '
              let s = require("fs").readFileSync(0, "utf8");
              s = s.slice(s.indexOf("["));
              const db = JSON.parse(s).find(d => d.name === "mns_inventory");
              process.stdout.write(db ? db.uuid : "");'
          }
          ID=$(get_id)
          if [ -z "$ID" ]; then
            echo "Creating D1 database mns_inventory..."
            wrangler d1 create mns_inventory
            ID=$(get_id)
          fi
          if [ -z "$ID" ]; then echo "Could not find or create D1 database"; exit 1; fi
          echo "D1 database id: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml

      - name: Deploy worker
        run: wrangler deploy
